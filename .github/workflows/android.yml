name: Android build

on:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install
        run: npm ci
      - name: Build web app
        run: python3 src/build.py
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK and unsigned release AAB
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: little-trainers-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
