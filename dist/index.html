<style>
/* מאלפים קטנים: עולם של שמיים בהירים וחטיפים צהובים. מסכים גדולים, כפתורים עגולים וגדולים, פונט עגול. */
:root{
  --bg:#e4f2ff; --card:#ffffff; --ink:#1b2a4e; --ink2:#51628a; --line:#c9dcf3;
  --accent:#2e7cf6; --accent-ink:#ffffff; --sun:#ffc531; --sun-ink:#4a3500;
  --good:#1fb77f; --warn:#ff6a5b; --soft:#f1f8ff;
  --fur:#e6cfa8; --furd:#cfae7c; --muzzle:#fbf1de; --cat:#e8a35c; --catd:#c98040;
  --shadow:0 6px 0 rgba(27,42,78,.12);
  --f-body:'Noto Sans Hebrew','Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --f-display:'Noto Sans Hebrew','Varela Round','Rubik',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b35; --card:#18284a; --ink:#eaf2ff; --ink2:#a5b6d8; --line:#2b3f6b;
  --accent:#6aa5ff; --accent-ink:#0b1630; --sun:#ffd04d; --sun-ink:#3d2d00;
  --good:#3ed49b; --warn:#ff8a7d; --soft:#142243; --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b35; --card:#18284a; --ink:#eaf2ff; --ink2:#a5b6d8; --line:#2b3f6b;
  --accent:#6aa5ff; --accent-ink:#0b1630; --sun:#ffd04d; --sun-ink:#3d2d00;
  --good:#3ed49b; --warn:#ff8a7d; --soft:#142243; --shadow:0 6px 0 rgba(0,0,0,.35); color-scheme:dark}
body[data-who="lia"]{--accent:#e8458f; --accent-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-who="lia"]{--accent:#ff7ab6;--accent-ink:#35001b}}
:root[data-theme="dark"] body[data-who="lia"]{--accent:#ff7ab6;--accent-ink:#35001b}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font:500 17px/1.5 var(--f-body);direction:rtl;
  padding-inline:16px;padding-block:12px 28px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,label:focus-within{outline:4px solid var(--sun);outline-offset:3px}
.btn{min-height:56px;padding:12px 22px;border-radius:22px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(27,42,78,.12)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.btn.good{background:var(--good);color:#06291d}
.btn.warn{background:var(--warn);color:#3a0600}
.btn.big{min-height:76px;font-size:1.3rem;border-radius:28px}
.card{background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.back{min-height:48px;min-width:48px;padding:8px 16px;border-radius:18px;background:var(--card);border:3px solid var(--line);font-weight:700}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.2rem}
.muted{color:var(--ink2);font-size:.95rem}
.tag{display:inline-flex;gap:6px;align-items:center;padding:3px 12px;border-radius:99px;background:var(--soft);border:2px solid var(--line);font-size:.85rem;font-weight:700}

.avatarWrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.avatar{width:min(84vw,320px);aspect-ratio:1;filter:drop-shadow(0 8px 0 rgba(27,42,78,.10))}
.avatar svg{width:100%;height:100%;overflow:visible}
.avatar .mo{display:none;transform-box:fill-box;transform-origin:center}
.avatar.talk .mc{display:none}
.avatar.talk .mo{display:block;animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.15)}}
.avatar.bounce svg{animation:bounce .6s ease 2}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.bubble{background:var(--card);border-radius:26px;padding:16px 20px;box-shadow:var(--shadow);font-size:1.15rem;text-align:center;position:relative;min-width:0;width:100%}
.bubble::before{content:"";position:absolute;top:-12px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:0;border-bottom-color:var(--card)}
.bubble.lia{font-size:1.5rem}

.who-card{flex-direction:row;align-items:center;gap:16px;text-align:start;padding:20px;border:4px solid transparent;width:100%}
.who-card .big-dot{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:2.4rem;flex:none}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:18px 10px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:1.1rem;text-align:center}
.tile:active{transform:translateY(3px)}
.tile .ic{font-size:2.8rem;line-height:1}
.tile.t1{background:var(--accent);color:var(--accent-ink)}
.tile.t2{background:var(--sun);color:var(--sun-ink)}

.seg{display:flex;gap:8px;background:var(--soft);padding:6px;border-radius:24px;border:3px solid var(--line)}
.seg button{flex:1;min-height:52px;border-radius:18px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sample{background:var(--soft);border:3px solid var(--line);border-radius:22px;min-height:96px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.9rem;font-weight:700;text-align:center}
.sample .pic{font-size:2rem}
.mic{width:140px;height:140px;border-radius:50%;margin:0 auto;background:var(--warn);color:#3a0600;font-size:3.2rem;display:grid;place-items:center;box-shadow:0 8px 0 rgba(27,42,78,.15)}
.mic.rec{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.meter{height:20px;background:var(--soft);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--sun),var(--warn));border-radius:99px;transition:width .5s}
.bar{display:grid;grid-template-columns:7.5rem 1fr 4.5rem;gap:8px;align-items:center;font-size:.95rem}
.bar .meter{height:14px}
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.face{border-radius:24px;padding:12px 4px;text-align:center;background:var(--soft);border:4px solid var(--line);opacity:.5;font-weight:700}
.face .e{font-size:3rem;line-height:1.1}
.face.on{opacity:1;border-color:var(--accent);background:var(--card);transform:scale(1.06);box-shadow:var(--shadow)}
.conf{display:inline-flex;gap:4px;vertical-align:middle}
.conf b{width:14px;height:14px;border-radius:50%;background:var(--line)}
.conf b.on{background:var(--sun)}
.sci{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.sci .k{flex:none;font-size:1.3rem}
details summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.steps.pic li{font-size:1.4rem;align-items:center}
.trick{width:100%;display:flex;flex-direction:row;align-items:center;gap:14px;text-align:start;padding:14px 16px}
.trick .ic{font-size:2.4rem;flex:none}
.lvl{display:flex;gap:4px;margin-inline-start:auto;flex:none}
.lvl i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--good)}
.clicker{width:180px;height:180px;border-radius:50%;margin:4px auto;background:var(--sun);color:var(--sun-ink);font-family:var(--f-display);font-size:2rem;display:grid;place-items:center;box-shadow:0 10px 0 rgba(120,80,0,.3)}
.clicker:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(120,80,0,.3)}
.ring{width:150px;height:150px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums;direction:ltr}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:18px;padding:10px 14px;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{border-radius:22px;background:var(--soft);border:3px dashed var(--line);padding:10px 4px;text-align:center;font-size:.85rem;font-weight:700;opacity:.55}
.badge .e{font-size:2.4rem;filter:grayscale(1)}
.badge.on{opacity:1;border:3px solid var(--sun);background:var(--card)}
.badge.on .e{filter:none}
.scene{font-size:5rem;text-align:center;line-height:1.1}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:20px;padding:14px 18px;font-weight:700;text-align:center;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.note{background:var(--soft);border:3px solid var(--line);border-radius:20px;padding:12px 14px;font-size:.95rem}
.src li{margin-bottom:6px}
.src{padding-inline-start:20px;margin:0;font-size:.9rem;color:var(--ink2)}
input[type=range]{width:100%;accent-color:var(--accent);height:40px}
.file{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.samples{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{grid-template-columns:6rem 1fr 3.8rem}}

.lvhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.namebox{width:100%}
.namebox input{font:inherit;font-size:1.3rem;min-height:56px;border-radius:18px;border:3px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 14px;text-align:center;-webkit-user-select:text;user-select:text}
#app p,#app h1,#app h2,#app h3,#app li,#app .note,#app .bubble{cursor:pointer}
.reading{outline:4px solid var(--sun);outline-offset:4px;border-radius:12px;transition:outline-color .3s}

.stage{position:relative;display:flex;justify-content:center}
.ghand{position:absolute;font-size:3.4rem;line-height:1;opacity:0;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));transform-origin:50% 80%}
.ghand.go{opacity:1}
.ghand.go.fx-up{animation:hUp 1.1s ease-in-out}
.ghand.go.fx-down{animation:hDown 1.1s ease-in-out}
.ghand.go.fx-push{animation:hPush 1.1s ease-in-out}
.ghand.go.fx-high{animation:hHigh 1.1s ease-in-out}
.ghand.go.fx-circle{animation:hCircle 1.1s linear}
.ghand.go.fx-bigcircle{animation:hBig 1.1s linear}
.ghand.go.fx-sweep{animation:hSweep 1.1s ease-in-out}
.ghand.go.fx-bang{animation:hBang 1.1s ease-out}
.ghand.go.fx-arc{animation:hArc 1.1s ease-in-out}
@keyframes hUp{0%{transform:translateY(40px);opacity:0}20%{opacity:1}80%{transform:translateY(-30px);opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes hDown{0%{transform:translateY(-20px);opacity:0}20%{opacity:1}80%{transform:translateY(60px);opacity:1}100%{opacity:0}}
@keyframes hPush{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.15);opacity:1}55%{transform:scale(.95)}80%{transform:scale(1.1);opacity:1}100%{opacity:0}}
@keyframes hHigh{0%{transform:translateY(30px) scale(.8);opacity:0}30%{transform:translateY(-40px) scale(1.15);opacity:1}85%{transform:translateY(-40px) scale(1.15);opacity:1}100%{opacity:0}}
@keyframes hCircle{0%{transform:rotate(0) translateX(28px) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:rotate(-720deg) translateX(28px) rotate(720deg);opacity:0}}
@keyframes hBig{0%{transform:rotate(0) translateX(50px) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:rotate(-360deg) translateX(50px) rotate(360deg);opacity:0}}
@keyframes hSweep{0%{transform:translate(30px,-20px);opacity:0}20%{opacity:1}80%{transform:translate(-30px,60px) rotate(-20deg);opacity:1}100%{opacity:0}}
@keyframes hBang{0%{transform:scale(.8);opacity:0}20%{transform:scale(1.1);opacity:1}35%{transform:rotate(-30deg) scale(1.2)}55%{transform:rotate(0)}85%{opacity:1}100%{opacity:0}}
@keyframes hArc{0%{transform:translate(50px,50px);opacity:0}20%{opacity:1}60%{transform:translate(0,-40px)}85%{transform:translate(-50px,40px);opacity:1}100%{opacity:0}}
.gtimer{position:absolute;top:6px;inset-inline:10%;height:12px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.gtimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--warn),var(--sun),var(--good));margin-inline-start:auto}
.gstars{position:absolute;top:30%;inset-inline:0;text-align:center;font-size:3rem;opacity:0;pointer-events:none}
.gstars.pop{animation:sPop 1.4s ease-out}
@keyframes sPop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:translateY(-20px)}100%{opacity:0;transform:translateY(-50px)}}
.gtray{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.clicker.small{width:110px;height:110px;font-size:1.4rem;margin:0}
.treat{width:96px;height:96px;border-radius:50%;background:var(--card);border:4px dashed var(--line);display:grid;place-items:center;font-size:3rem;touch-action:none;cursor:grab;box-shadow:var(--shadow)}
.treat.ready{border:4px solid var(--good);animation:pulse 1s ease-in-out infinite}
.flytreat{position:fixed;font-size:2.6rem;z-index:20;pointer-events:none;transition:left .42s ease-in,top .42s cubic-bezier(.3,-0.4,.7,1),transform .42s}
.flytreat.drag{transition:none;font-size:3rem}
.gsigns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gsign{background:var(--card);border-radius:22px;box-shadow:var(--shadow);min-height:64px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:1.05rem;text-align:start}
.gsign .h{font-size:2rem;flex:none}
.gsign .lvl{margin-inline-start:auto}
.gsign .lvl i{width:9px;height:9px}
.gsign:disabled{opacity:.45}
.bubble.warnb{border:3px solid var(--warn)}
[hidden]{display:none!important}

/* טיפול וארון בגדים */
.stage.care{border-radius:28px;overflow:hidden;background:linear-gradient(var(--soft),var(--bg));border:3px solid var(--line)}
.stage.care .avatar{position:relative;z-index:1}

async function recordMic(sec,tick){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nomic');
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const c=audio();await c.resume();
  const src=c.createMediaStreamSource(stream),proc=c.createScriptProcessor(4096,1,1),ch=[];
  proc.onaudioprocess=e=>ch.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(proc);proc.connect(c.destination);
  for(let s=sec;s>0;s--){tick&&tick(s);await new Promise(r=>setTimeout(r,1000))}
  proc.disconnect();src.disconnect();stream.getTracks().forEach(t=>t.stop());
  const n=ch.reduce((a,b)=>a+b.length,0),out=new Float32Array(n);let p=0;ch.forEach(b=>{out.set(b,p);p+=b.length});
  return{x:out,sr:c.sampleRate};
}
function decode(buf){const c=audio();return new Promise((ok,no)=>{const p=c.decodeAudioData(buf,ok,no);if(p&&p.then)p.then(ok,no)})}
async function fromFile(file){const b=await decode(await file.arrayBuffer());let x=b.getChannelData(0);if(x.length>b.sampleRate*20)x=x.slice(0,b.sampleRate*20);return{x:new Float32Array(x),sr:b.sampleRate}}

  award();
}

function avatarFromPhoto(file,msg){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=40;const g=c.getContext('2d');
    const s=Math.min(img.width,img.height)*.5,sx=(img.width-s)/2,sy=(img.height-s)/2;g.drawImage(img,sx,sy,s,s,0,0,40,40);
    const d=g.getImageData(0,0,40,40).data;let r=0,gg=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];b+=d[i+2];n++}
    r/=n;gg/=n;b/=n;const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);
    // להחזיר גוון בטוח ונעים: לא כהה מדי ולא בהיר מדי
    const k=Math.min(1.3,Math.max(.75,170/((r+gg+b)/3||1)));const cl=v=>Math.round(Math.max(60,Math.min(245,v*k)));
    const R=cl(r),G=cl(gg),B=cl(b);
    if(S.who)D().fur=`rgb(${R},${G},${B})`;else S.fur=`rgb(${R},${G},${B})`;save();setFur();URL.revokeObjectURL(url);toast(msg||'הפרווה של '+DN()+' עודכנה. התמונה לא נשמרה.');speak('וואו, ככה אני נראה!')};
  img.onerror=()=>toast('לא הצלחנו לקרוא את התמונה');img.src=url;
}

  if(GL.ok)GL.setFur(m,tri);const r=document.documentElement.style;r.setProperty('--fur',f);r.setProperty('--furd',`rgb(${dk})`);r.setProperty('--muzzle',`rgb(${lt})`)}

const PT=new Map();let pinch=null,lastTap=0;
document.addEventListener('pointerdown',e=>{if(!GL.ok||CB.brush)return;const a=e.target.closest('.avatar');if(!a||e.target.closest('.nb'))return;
  PT.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()});try{a.setPointerCapture(e.pointerId)}catch(_){}
  if(PT.size===2){const [p,q]=[...PT.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y)||1,mx:(p.x+q.x)/2,my:(p.y+q.y)/2}}});
addEventListener('pointermove',e=>{const p=PT.get(e.pointerId);if(!p||!GL.ok)return;const a=$('.avatar'),w=a?a.getBoundingClientRect().width:300;
  if(PT.size===1){GL.rotate((e.clientX-p.x)*.012);if(GL.tilt)GL.tilt((e.clientY-p.y)*.008)}
  p.x=e.clientX;p.y=e.clientY;
  if(PT.size===2&&pinch){const [u,v]=[...PT.values()],d=Math.hypot(u.x-v.x,u.y-v.y)||1,mx=(u.x+v.x)/2,my=(u.y+v.y)/2;
    GL.zoomBy(d/pinch.d);GL.pan((mx-pinch.mx)/w,(my-pinch.my)/w);pinch={d,mx,my}}});
const pEnd=e=>{const p=PT.get(e.pointerId);PT.delete(e.pointerId);if(PT.size<2)pinch=null;
  if(p&&PT.size===0&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<8&&performance.now()-p.t<300){const now=performance.now();if(now-lastTap<350&&GL.ok){GL.resetView();lastTap=0}else lastTap=now}};
addEventListener('pointerup',pEnd);addEventListener('pointercancel',pEnd);
addEventListener('wheel',e=>{if(GL.ok&&e.target.closest&&e.target.closest('.avatar')){e.preventDefault();GL.zoomBy(e.deltaY<0?1.1:.91)}},{passive:false});

const trSum=d=>Object.values(d.tricks||{}).reduce((a,b)=>a+(+b||0),0);
const memW=d=>d.mem?(d.mem.w.e||0)+(d.mem.w.m||0)+(d.mem.w.h||0):0;
const snap=d=>({st:d.game.stars,tr:d.translations,q:d.quiz,mw:memW(d),ob:d.obs?d.obs.runs:0,tk:trSum(d),cl:d.clicks});
const DCH=[
 {id:'stars',t:'לצבור 3 כוכבים במשחקים',n:3,v:(d,b)=>d.game.stars-b.st},
 {id:'listen',t:'להקשיב לשני קולות של הכלב',n:2,v:(d,b)=>d.translations-b.tr},
 {id:'mem',t:'לנצח במשחק זיכרון אחד',n:1,v:(d,b)=>memW(d)-b.mw},
 {id:'course',t:'לסיים מסלול מכשולים אחד',n:1,v:(d,b)=>(d.obs?d.obs.runs:0)-b.ob},
 {id:'quiz',t:'להשלים חידון בטיחות אחד',n:1,v:(d,b)=>d.quiz-b.q},
 {id:'trick',t:'לתרגל טריק אחד באילוף',n:1,v:(d,b)=>trSum(d)-b.tk},
 {id:'click',t:'ללחוץ 10 פעמים על הקליקר',n:10,v:(d,b)=>d.clicks-b.cl}];
const dayAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function dailyOf(){const d=X(),k=dayKey();
  if(d.daily.day!==k){d.daily.day=k;d.daily.base=snap(d);d.daily.done=false;save()}
  let h=0;(k+(U()?U().id:'')).split('').forEach(c=>h=(h*31+c.charCodeAt(0))>>>0);const ch=DCH[h%DCH.length];
  const val=Math.min(ch.n,Math.max(0,ch.v(d,d.daily.base)));return {ch,val}}
function dailyCheck(){const d=X(),{ch,val}=dailyOf();if(!d.daily.done&&val>=ch.n){d.daily.done=true;d.daily.streak=(d.daily.last===dayAgo(1))?(d.daily.streak||0)+1:1;d.daily.last=dayKey();addStars(2);toast('🏅 האתגר היומי הושלם! קיבלתם 2 כוכבים')}}
function dailyCard(){const d=X();dailyCheck();const {ch,val}=dailyOf();
  return `<div class="card daily ${d.daily.done?'ok':''}"><h3>📅 האתגר היומי</h3><p>${ch.t}</p>${d.daily.done?`<p class="tag">✅ הושלם! רצף ימים: ${d.daily.streak}</p>`:`<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${ch.n}" aria-valuenow="${val}"><i style="width:${Math.round(val/ch.n*100)}%"></i></div><p class="muted">${val} מתוך ${ch.n}. הפרס: ⭐⭐</p>`}</div>`}

  return `<nav class="tabbar" aria-label="ניווט">${[['home','🏠','בית'],['play','🎮','משחקים'],['learnhub','📚','לומדים'],['me','⭐','שלי']].map(([k,e,n])=>`<button data-act="go" data-s="${k}" aria-current="${cur===k?'page':'false'}"><span aria-hidden="true">${e}</span><b>${n}</b></button>`).join('')}</nav>`}
function header(title,info){const hub=HUBOF[S.screen]||'home';
  return `<div class="top"><button class="back" data-act="go" data-s="${hub}" aria-label="חזרה">→ חזרה</button><div class="who"><span class="ttl">${esc(title||'')}</span>${info?`<button class="back sm" data-act="info" aria-label="מידע">ℹ️</button>`:''}<span class="dot">${esc(INI(U()))}</span></div></div>`+
   (info?`<div class="sheet" id="sheet" hidden><div class="sheetc" role="dialog" aria-label="מידע">${info}<button class="btn ghost" data-act="sheetX">סגירה</button></div></div>`:'')}
A.info=()=>{const s=$('#sheet');if(s)s.hidden=false};
A.sheetX=()=>{const s=$('#sheet');if(s)s.hidden=true};
document.addEventListener('click',e=>{if(e.target&&e.target.id==='sheet')e.target.hidden=true});
const hubTop=t=>`<div class="top"><div class="who"><span class="ttl">${t}</span></div><div class="who"><button class="back sm" data-act="login" aria-label="החלפת משתמש">⇄</button><span class="dot">${esc(INI(U()))}</span></div></div>`;
function dailyPill(){const d=X();dailyCheck();const {ch,val}=dailyOf();
  return `<div class="dpill ${d.daily.done?'ok':''}" role="status"><span aria-hidden="true">📅</span><span class="t">${ch.t}</span><b>${d.daily.done?'✅':val+'/'+ch.n}</b></div>`}

/* ---------- מסכי הבית ---------- */
V.home=()=>{const g=greet();
  return `<div class="top"><button class="back" data-act="login">→ החלפת משתמש</button><div class="who"><span class="dot">${esc(INI(U()))}</span></div></div>
  <div class="avatarWrap">${avatar('dog','happy')}
   ${S.editName?`<form class="card namebox" id="nameForm"><label for="dogName"><b>איך קוראים לכלב?</b></label><input id="dogName" maxlength="24" value="${esc(DN())}" autocomplete="off" enterkeyhint="done"><div class="grid2"><button class="btn good" type="submit">שמירה</button><button class="btn ghost" type="button" data-act="nameCancel">ביטול</button></div></form>`
   :`<div class="row nmrow"><h2>${esc(DN())}</h2><button class="back sm" data-act="nameEdit" aria-label="שינוי שם הכלב">✏️</button></div>`}
   <button class="bubble ${lia()?'lia':''}" data-act="hello" style="border:0;color:inherit;font:inherit">${g}</button></div>
  ${dailyPill()}
  <button class="btn sun big" data-act="go" data-s="game">🎮 משחק: מאלפים את ${esc(DN())}</button>`};
const tile=(s,e,n,cls,x)=>`<button class="tile ${cls||''}" data-act="go" data-s="${s}" ${x||''}><span class="ic">${e}</span>${n}</button>`;
V.play=()=>`${hubTop('🎮 משחקים')}<div class="hub">
  ${tile('game','🎮','משחק אילוף','t2')}${tile('mem','🧩','משחק זיכרון')}${tile('course','🚧','מסלול מכשולים')}
  ${tile('care','🐾','לטפל ב'+esc(DN()),'care '+(lowNeed(pet())?'alert':''))}${tile('dress','👕','ארון בגדים')}${tile('color','🖍️','מצב צביעה')}</div>`;
V.learnhub=()=>`${hubTop('📚 לומדים')}<div class="hub">
  ${tile('translate','👂','מה הכלב אומר?','t1')}${tile('train','🦴','אילוף','t2')}${tile('learn','📚','כרטיסיות לימוד')}
  ${tile('safety','🛡️','פינת הבטיחות')}${tile('story','📖','הסיפור של היום')}</div>`;
V.me=()=>`${hubTop('⭐ שלי')}<div class="hub">
  ${tile('stars','⭐','הכוכבים שלי','t2')}${tile('coll','🏆','אוסף הגזעים')}${tile('album','🖼️','האלבום שלי')}
  ${tile('cert','🏅','תעודה')}${tile('real','🐶','הכלב שלנו','','data-nocat="1"')}${tile('prof','👤','הפרופיל שלי')}</div>`;

/* ---------- כניסה ---------- */
V.login=()=>`
<div class="avatarWrap">${avatar('dog','happy')}<h1><span class="logo" aria-hidden="true">🐶🐱</span> מאלפים קטנים</h1><p class="muted">${S.users.length?'מי משחק היום?':'בואו נפתח משתמש ראשון!'}</p></div>
<div class="ulist">${S.users.map(u=>`<button class="card who-card" data-act="pick" data-who="${u.id}" style="border-color:${u.color}"><span class="big-dot" style="background:${u.color};color:#fff">${esc(INI(u))}</span><span><h2>${esc(u.name)}</h2><span class="muted">${u.animal==='cat'?'🐱':'🐕'} ${esc((S.data[u.id]&&S.data[u.id].dogName)||'')} · ${simpleOf(u)?'מצב פשוט':'מצב מתקדם'}</span></span></button>`).join('')}</div>
<div class="grid2"><button class="btn" data-act="newu">➕ משתמש חדש</button><button class="btn ghost" data-act="parent">🔒 להורים</button></div>
${langSeg()}`;

/* ---------- משחק אילוף ---------- */
V.game=()=>{const d=D();const list=GSIGNS.filter(s=>(!lia()||GLIA.includes(s.id))&&(!petCat()||!['bang','howl'].includes(s.id)));
 const info=`<h3>איך זה עובד?</h3><p>כמו באילוף אמיתי: הקליק אומר לכלב "בדיוק את זה!", והחטיף צריך להגיע מהר. כלב מקשר בין מה שעשה לבין הפרס רק אם הפרס מגיע תוך שנייה או שתיים. סימן ש${esc(DN())} עוד לא מכיר טוב, הוא לפעמים מתבלבל ועושה משהו אחר. אז לא נותנים חטיף, לוחצים "לא הפעם" ומנסים שוב.</p>${lia()?'':'<p class="muted">הנקודות: כמה טוב '+esc(DN())+' מכיר כל סימן</p>'}`;
 return `${header(lia()?'משחק אילוף':'משחק: מאלפים את '+esc(DN()),info)}
 <div class="stage" id="stage">${avatar('dog','happy')}<div class="ghand" id="gHand" aria-hidden="true"></div><div class="gtimer" id="gTimer" hidden><i></i></div><div class="gstars" id="gStars" aria-live="polite"></div><span class="tag ovtag" id="gStarsTag">⭐ ${d.game.stars} כוכבי אילוף</span></div>
 <div class="bubble ${lia()?'lia':''}" id="gMsg">${lia()?'בוחרים סימן, וכש'+esc(DN())+' עושה אותו, נותנים לו חטיף!':'בחרו סימן. כש'+esc(DN())+' מבצע: קליק, ואז גוררים חטיף לפה. יש לכם '+(GW()>1?3:2)+' שניות!'}</div>
 <div class="gsigns hrow">${list.map(s=>`<button class="gsign" data-act="gSign" data-id="${s.id}"><span class="h">${s.hand}</span><b>${s.n}</b>${lia()?'':`<span class="lvl">${[1,2,3,4,5].map(i=>`<i class="${gK(s.id)>=i?'on':''}"></i>`).join('')}</span>`}</button>`).join('')}</div>
 <div class="gtray dock">
   <button class="clicker small" data-act="gClick" aria-label="קליק">קליק</button>
   <div class="treat" id="gTreat" role="button" tabindex="0" aria-label="חטיף. גוררים אל הכלב או לוחצים">🍖</div>
   <button class="btn warn" id="gNo" data-act="gNo" hidden>✋ לא הפעם</button>
 </div>`};

/* ---------- טיפול ---------- */
V.care=()=>{const p=pet(),low=lowNeed(p);
  const msg=low?LM(low.k):(lia()?'אני מרגיש מצוין! תודה '+UNAME()+'!':'אני מרגיש מצוין. תודה על הטיפול!');
  const strip='🌳 🌷 🏡 🌳 🌼 🌲 ⛲ 🌷 '.repeat(2);
  const info=`<div class="note" id="cFact">💡 כל פעולה מלמדת משהו על טיפול אמיתי בכלב. לוחצים ובודקים.</div><p class="muted">יום מושלם: כשכל הלבבות כמעט מלאים (ארבעה מתוך חמישה), מקבלים כוכב אחד פעם ביום. הכוכבים משמשים לקניית בגדים.</p><p class="muted">${lia()?'מחליקים את הכדור למעלה וזורקים!':'מחליקים את הכדור למעלה כדי לזרוק. החלקה ארוכה זורקת רחוק יותר.'}</p>`;
  return `${header('לטפל ב'+DN(),info)}
  <div class="stage care" id="cstage"><div class="bgwalk" aria-hidden="true"><div class="track"><span>${strip}</span><span>${strip}</span></div></div>
   <div class="night" aria-hidden="true"><span class="moon">🌙</span></div>${avatar('dog',low?'sad':'happy')}<div class="zzz" aria-hidden="true">💤</div><span class="tag ovtag" id="cWal">⭐ ${wallet()} כוכבים</span></div>
  <div class="bubble ${lia()?'lia':''}" id="cMsg">${msg}</div>
  <div class="meter" id="bprog" hidden><i></i></div>
  <div class="needs six">${NEEDS.map(NI).map(n=>`<button class="need" data-act="care" data-k="${n.k}" aria-label="${n.n}"><span class="ic">${n.ic}</span><span class="hr" aria-hidden="true">${[0,1,2,3,4].map(i=>`<i class="${i<hearts(p[n.k])?'on':''}"></i>`).join('')}</span><span class="nm">${n.n}</span></button>`).join('')}</div>
  <div class="dock toyrow"><div class="toy" id="toy" role="button" tabindex="0" aria-label="זורקים כדור">${petCat()?'🧶':'🎾'}</div><span class="muted">${lia()?'מחליקים את הכדור למעלה וזורקים!':'מחליקים את הכדור למעלה כדי לזרוק.'}</span><button class="btn sun" data-act="go" data-s="dress">👕</button></div>`};

/* ---------- ארון בגדים ---------- */
const dressOld=V.dress;
V.dress=()=>{const h=dressOld(),a=h.indexOf('<div class="seg wrap"'),b=h.lastIndexOf('<button class="btn sun" data-act="go" data-s="game">');
  const help=`<p class="muted">${lia()?'אצבע אחת מסובבת. שתיים מקרבות.':'👆 אצבע אחת מסובבת ומטה · ✌️ שתי אצבעות מקרבות ומזיזות · הקשה כפולה מאפסת'}</p><p class="muted">כוכבים מקבלים במשחק האילוף ובטיפול היומי</p><button class="btn sun" data-act="go" data-s="game">🎮 לצבור כוכבים במשחק</button>`;
  return `${header('ארון הבגדים',help)}
  <div class="stage">${avatar('dog','happy')}<span class="tag ovtag" id="cWal">⭐ ${wallet()} כוכבים</span>
   <div class="ovbtns"><button class="back sm" data-act="petShot" aria-label="צילום לאלבום">📸</button>${GL.ok?'<button class="back sm" data-act="vreset" aria-label="איפוס">↺</button>':''}</div></div>
  ${a>=0&&b>a?h.slice(a,b):''}`};

/* ---------- זיכרון ---------- */
const memOld=V.mem;
V.mem=()=>{const m=S.mm;if(!m)return memOld();const L=MML[m.lv],n=L.n*2,rows=Math.ceil(n/L.c);
  return `${header('משחק זיכרון')}
  <div class="row" style="justify-content:space-between"><span class="tag">${L.ic} ${L.t}</span><span class="tag">מהלכים: <b id="mmMoves">${m.moves}</b></span></div>
  <div class="mbox"><div class="mgrid c${L.c}" id="mmGrid" style="--ar:${L.c}/${rows};grid-template-rows:repeat(${rows},minmax(0,1fr))">${mmGrid()}</div></div>
  <div class="bubble ${lia()?'lia':''}" id="mmMsg">${m.done?'':'פותחים שני קלפים. אם הם זהים, הם נשארים פתוחים.'}</div>
  <div class="grid2 dock"><button class="btn ghost" data-act="mmAgain">🔁 משחק חדש</button><button class="btn ghost" data-act="mmMenu">🎚️ שינוי רמה</button></div>`};

/* ---------- מסלול מכשולים ---------- */
const courseOld=V.course;
V.course=()=>{const o=S.ob;
  const rules=`<h3>הפקודות במסלול</h3><ul class="rules">${OBS.slice(0,5).map(x=>`<li><span style="font-size:1.6rem">${x.e}</span>${x.n}: ${sgn(x.sg).n}</li>`).join('')}</ul>`;
  if(!o)return `${header('מסלול מכשולים',rules)}
  <div class="avatarWrap">${avatar('dog','happy')}<div class="bubble ${lia()?'lia':''}">${esc(DN())} רץ במסלול! בכל מכשול נותנים פקודה אחרת.</div></div>
  <button class="btn ghost" data-act="info">💡 הפקודות במסלול</button>
  <button class="btn sun big" data-act="obGo">🏁 מתחילים!</button>`;
  return `${header('מסלול מכשולים',rules)}
  <div class="stage" id="stage">${avatar('dog','happy')}</div>
  <div class="otrack" id="obTrack">${obTrack()}</div>
  <div class="bubble ${lia()?'lia':''}" id="obMsg">${obPrompt()}</div>
  <div class="gsigns hrow" id="obCmds">${OBSG.map(id=>{const s=sgn(id);return `<button class="gsign" data-act="obCmd" data-id="${id}"><span class="h">${s.hand}</span><b>${s.n}</b></button>`}).join('')}</div>
  <div class="grid2 dock">${ageBand()==='big'?`<button class="btn ghost" data-act="obHint">💡 רמז</button>`:''}<button class="btn ghost" data-act="obQuit">${o.done?'🔁 מסלול חדש':'↩ יציאה'}</button></div>`};

/* ---------- מה הכלב אומר ---------- */
const trOld=V.translate;
V.translate=()=>{if(S.res)return trOld();const sm=Engine.SAMPLES[S.animal];
  const info=`<p class="muted">${MIC==='native'?'נפתח מקליט הקול של הטלפון. מקליטים כמה שניות את הכלב, לוחצים סיום, והניתוח מתחיל. ההקלטה לא נשמרת באפליקציה.':'ההקלטה נשארת במכשיר ונמחקת מיד אחרי הניתוח.'}</p>
   ${lia()?'':`<label class="btn ghost" for="upl">📁 העלאת הקלטה מהמכשיר</label><input class="file" id="upl" type="file" accept="audio/*" aria-label="העלאת קובץ שמע">`}
   ${S.animal==='cat'?`<p class="note">אין חתול בבית? אפשר לשמוע צלילי דוגמה של חתול.</p>`:''}`;
  return `${header(lia()?'מה הוא אומר?':'מתרגמים קולות',info)}
  <div class="seg" role="group" aria-label="בחירת חיה"><button data-act="animal" data-a="dog" aria-pressed="${S.animal==='dog'}">🐕 כלב</button><button data-act="animal" data-a="cat" aria-pressed="${S.animal==='cat'}">🐈 חתול</button></div>
  <div class="avatarWrap">${avatar(S.animal,'happy')}</div>${S.animal==='cat'?catPick().replace('class="chips"','class="chips hrow"'):''}
  <div class="bubble ${lia()?'lia':''}">${lia()?'לחצו והקשיבו!':'לחצו על המיקרופון ליד '+(S.animal==='dog'?'הכלב':'החתול')+', או בחרו דוגמה.'}</div>
  <div class="dock microw">
   ${MIC==='native'?`<label class="mic" for="cap" aria-label="הקלטה בטלפון">🎤</label><input class="file" id="cap" type="file" accept="audio/*" capture>`
    :`<button class="mic ${S.busy?'rec':''}" data-act="mic" aria-label="הקלטה של 6 שניות">${S.busy?'<span id="cd" style="font-size:2rem;font-family:var(--f-display)">6</span>':'🎤'}</button>`}
   <div class="samples hrow">${sm.map(s=>`<button class="sample" data-act="sample" data-id="${s.id}"><span class="pic">${s.pic}</span>${esc(s.label)}</button>`).join('')}</div></div>
  <p class="muted mmsg" id="micMsg"></p>`};

/* ---------- כרטיסיות, אלבום, אוסף ---------- */
const learnOld=V.learn;
V.learn=()=>{let h=learnOld();if(S.lr&&!S.lr.quiz)h=h.replace('<div class="seg wrap" role="group" aria-label="נושא">','<div class="seg hrow" role="group" aria-label="נושא">');return h};
const albumOld=V.album;
V.album=()=>{let h=albumOld();return h.replace('<div class="agrid">','<div class="agrid hrow">')};

render();
})();

</script>
